# Candidate universe for ETF_PULLBACK_V1 (spec §3). Written 2026-10-07, before any backtest run.
# Membership on a date is decided by the spec rules (>= 756 sessions of data, ADV20 >= $50M),
# not by this list alone. Plain ETFs only: no leveraged, inverse or ETN products.
#
# Fields:
#   inception       first trading date as remembered — VERIFY against the first bar in P1.A.04
#   listing         primary exchange — VERIFY with IBKR contract details in P1.B.05 (OPG cut-off depends on it)
#   group           correlation group for the 30% cap (spec §5.3 #5)
#   half_spread_bps ASSUMPTION, deliberately conservative; calibrate with IBKR quotes in P1.B.06

[universe]
id = "etf_pullback_v1"
calendar = "XNYS"
currency = "USD"

